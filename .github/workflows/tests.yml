# Автопроверка: при каждом Push на GitHub прогоняются тесты (папка tests/).
# Результат — ✅ или ❌ рядом с коммитом на GitHub. Если в Railway включено
# «Wait for CI», бот не задеплоится, пока тесты не прошли.
name: Тесты

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Тесты
        run: python -m pytest -q
